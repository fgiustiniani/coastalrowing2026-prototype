name: Finalizza loghi locali

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/fetch-locali-logos-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 2

      - name: Verifica asset locali
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/logos/locali/Donna-Amalia.png
          test -s assets/logos/locali/alice-gelato-meraviglie.png
          test -s assets/logos/locali/ELCID.jpg
          test -s assets/logos/locali/BistroJournal.jpg
          test -s assets/logos/locali/Giro-di-Boa.png
          test -s assets/logos/locali/portolotto.png
          test -s assets/logos/locali/Botanic.png

      - name: Collega tutti i loghi locali
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('vivi-pesaro.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ('src="https://ristorantedonnamalia.it/wp-content/uploads/2025/03/1527d32d-dc97-4cba-aaeb-e9749e29d3aa.png"', 'src="assets/logos/locali/Donna-Amalia.png"'),
              ('src="https://alicegelati.it/wp-content/uploads/2024/04/LOGO-300-1.svg"', 'src="assets/logos/locali/alice-gelato-meraviglie.png"'),
              ('src="https://ristorantegirodiboa.it/wp-content/uploads/2026/05/vector.png"', 'src="assets/logos/locali/Giro-di-Boa.png"'),
              ('src="https://www.botanicgroup.it/wp-content/uploads/2021/03/logo-home-mobile.jpg"', 'src="assets/logos/locali/Botanic.png"'),
              ('class="food-place__logo-link food-place__logo-link--text" href="https://www.facebook.com/share/1CG4o5pe8m/?mibextid=wwXIfr"', 'class="food-place__logo-link" href="https://www.facebook.com/share/1CG4o5pe8m/?mibextid=wwXIfr"'),
              ('<span class="food-place__logo-fallback">El Cid</span>', '<img class="food-place__logo" src="assets/logos/locali/ELCID.jpg" alt="Logo El Cid" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false">\n                  <span class="food-place__logo-fallback" hidden>El Cid</span>'),
              ('class="food-place__logo-link food-place__logo-link--text" href="https://www.instagram.com/bistrotjournal?stkn=cmJpcmFid2tmYW8y"', 'class="food-place__logo-link" href="https://www.instagram.com/bistrotjournal?stkn=cmJpcmFid2tmYW8y"'),
              ('<span class="food-place__logo-fallback">Journal</span>', '<img class="food-place__logo" src="assets/logos/locali/BistroJournal.jpg" alt="Logo Bistrot Journal" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false">\n                  <span class="food-place__logo-fallback" hidden>Journal</span>'),
              ('class="food-place__logo-link food-place__logo-link--text" href="https://www.instagram.com/portolotto_pesaro?stkn=MTJtY2FsdXoxZHhqMA=="', 'class="food-place__logo-link" href="https://www.instagram.com/portolotto_pesaro?stkn=MTJtY2FsdXoxZHhqMA=="'),
              ('<span class="food-place__logo-fallback">Portolotto</span>', '<img class="food-place__logo" src="assets/logos/locali/portolotto.png" alt="Logo Portolotto" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false">\n                  <span class="food-place__logo-fallback" hidden>Portolotto</span>'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Atteso 1 match, trovati {count}: {old[:100]}')
              text = text.replace(old, new, 1)

          required = [
              'assets/logos/locali/Donna-Amalia.png',
              'assets/logos/locali/alice-gelato-meraviglie.png',
              'assets/logos/locali/ELCID.jpg',
              'assets/logos/locali/BistroJournal.jpg',
              'assets/logos/locali/Giro-di-Boa.png',
              'assets/logos/locali/portolotto.png',
              'assets/logos/locali/Botanic.png',
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Riferimento locale mancante: {item}')

          if 'food-place__logo-link--text' in text:
              raise SystemExit('Sono rimasti placeholder testuali dei loghi')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit finale e rimuovi workflow temporaneo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fetch-locali-logos-v2.yml
          git add vivi-pesaro.html
          git commit -m "Usa loghi locali nella sezione Dove mangiare"
          git pull --rebase origin develop
          git push origin HEAD:develop
