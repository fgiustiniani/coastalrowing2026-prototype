name: Admin booking reporting enhancements

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/admin-reporting-20260912.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Apply admin reporting enhancements
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Anchor not found: {label} in {path}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # --- Admin HTML: styles, Excel button, society report section and JS ---
          replace_once(
              'admin-prenotazioni-barche.html',
              '''    .admin-export-button { flex: 0 0 auto; }\n''',
              '''    .admin-export-button { flex: 0 0 auto; }\n\n    .admin-slot-fill {\n      display: grid;\n      gap: 5px;\n      min-width: 92px;\n    }\n    .admin-slot-fill__value {\n      display: flex;\n      align-items: baseline;\n      justify-content: space-between;\n      gap: 8px;\n      white-space: nowrap;\n    }\n    .admin-slot-fill__value strong { color: #173e4b; font-size: .92rem; }\n    .admin-slot-fill__value span { color: #64757b; font-size: .78rem; font-weight: 800; }\n    .admin-slot-fill__track {\n      display: block;\n      height: 7px;\n      overflow: hidden;\n      border-radius: 999px;\n      background: #e5ecee;\n    }\n    .admin-slot-fill__track > span {\n      display: block;\n      width: var(--slot-fill, 0%);\n      height: 100%;\n      border-radius: inherit;\n      background: #2f8f6b;\n    }\n    .admin-slot-fill.is-medium .admin-slot-fill__track > span { background: #d59a2f; }\n    .admin-slot-fill.is-high .admin-slot-fill__track > span { background: #cf6b2c; }\n    .admin-slot-fill.is-full .admin-slot-fill__track > span { background: #b42318; }\n\n    .admin-society-report { display: grid; gap: 14px; }\n    .admin-society-card {\n      padding: 18px;\n      border: 1px solid #dfe8ea;\n      border-radius: 16px;\n      background: #fff;\n    }\n    .admin-society-card__head {\n      display: flex;\n      align-items: flex-start;\n      justify-content: space-between;\n      gap: 14px;\n      flex-wrap: wrap;\n      padding-bottom: 12px;\n      border-bottom: 1px solid #e7edef;\n    }\n    .admin-society-card__head h3 { margin: 0; color: #173e4b; font-size: 1.2rem; }\n    .admin-society-card__stats { display: flex; gap: 7px; flex-wrap: wrap; }\n    .admin-society-card__stat {\n      padding: 5px 9px;\n      border-radius: 999px;\n      background: #edf6f8;\n      color: #0b6478;\n      font-size: .78rem;\n      font-weight: 800;\n    }\n    .admin-society-card__contacts { margin: 12px 0 0; color: #52666c; font-size: .9rem; line-height: 1.5; }\n    .admin-society-bookings { display: grid; gap: 8px; margin-top: 14px; }\n    .admin-society-booking {\n      display: grid;\n      grid-template-columns: minmax(150px, .7fr) minmax(210px, 1fr) minmax(0, 1.6fr);\n      gap: 12px;\n      align-items: start;\n      padding: 10px 12px;\n      border-radius: 11px;\n      background: #f7fafb;\n      color: #334b52;\n      font-size: .88rem;\n      line-height: 1.4;\n    }\n    .admin-society-booking strong { color: #173e4b; }\n\n    @media (max-width: 760px) {\n      .admin-society-booking { grid-template-columns: 1fr; gap: 4px; }\n    }\n''',
              'admin styles'
          )

          replace_once(
              'admin-prenotazioni-barche.html',
              '''            <h2>Prenotazioni</h2>\n            <button class="admin-button admin-export-button" data-export-bookings-pdf type="button">Esporta PDF</button>\n''',
              '''            <h2>Prenotazioni</h2>\n            <button class="admin-button admin-export-button" data-export-bookings-pdf type="button">Esporta PDF</button>\n            <button class="admin-button admin-export-button" data-export-bookings-xlsx type="button">Esporta Excel</button>\n''',
              'excel button'
          )

          replace_once(
              'admin-prenotazioni-barche.html',
              '''          </details>\n\n          <details class="booking-card admin-collapsible">\n            <summary>Impostazioni prenotazioni</summary>\n''',
              '''          </details>\n\n          <details class="booking-card admin-collapsible">\n            <summary>Report per società</summary>\n            <div class="admin-collapsible__body">\n              <p class="booking-card__intro">Una scheda riepilogativa per ogni società che ha effettuato almeno una prenotazione.</p>\n              <div class="admin-society-report" data-admin-society-report style="margin-top:18px"></div>\n            </div>\n          </details>\n\n          <details class="booking-card admin-collapsible">\n            <summary>Impostazioni prenotazioni</summary>\n''',
              'society report section'
          )

          replace_once(
              'admin-prenotazioni-barche.html',
              '''  <script src="boat-booking-admin.js" defer></script>\n  <script src="boat-booking-admin-list-ux.js" defer></script>\n  <script src="boat-booking-pdf-export.js" defer></script>\n''',
              '''  <script src="boat-booking-admin.js" defer></script>\n  <script src="boat-booking-admin-list-ux.js" defer></script>\n  <script src="boat-booking-pdf-export.js" defer></script>\n  <script src="boat-booking-admin-reports.js" defer></script>\n''',
              'reports script'
          )

          # --- Admin JS: slot occupancy indicator + expose current admin data ---
          old_matrix = '''  function renderMatrix() {\n    if (!matrix) return;\n    const columns = builders.flatMap((builder) => boatTypes.map((boatType) => [builder, boatType]));\n\n    matrix.innerHTML = `\n      <table class="admin-matrix">\n        <thead>\n          <tr>\n            <th>Slot</th>\n            ${columns.map(([builder, type]) => `<th>${builder}<br><small>${type}</small></th>`).join('')}\n          </tr>\n        </thead>\n        <tbody>\n          ${slots.map(([code, label]) => {\n            const info = slotInfo(code);\n            const isInactive = info?.active === false;\n            return `\n            <tr>\n              <th>${escapeHtml(info?.label || label)}${isInactive ? '<br><small>CHIUSO</small>' : ''}</th>\n              ${columns.map(([builder, type]) => {\n                const row = availabilityRow(code, builder, type) || { booked: 0, capacity: 0, remaining: 0 };\n                const noBoats = Number(row.capacity) === 0;\n                const full = !noBoats && Number(row.remaining) <= 0;\n                return `<td class="admin-matrix__cell${full ? ' is-full' : ''}${noBoats ? ' is-empty' : ''}">\n                  <strong>${row.booked}/${row.capacity}</strong>\n                  <small>${isInactive ? 'SLOT CHIUSO' : noBoats ? 'NESSUNA BARCA' : full ? 'COMPLETO' : `${row.remaining} libere`}</small>\n                </td>`;\n              }).join('')}\n            </tr>`;\n          }).join('')}\n        </tbody>\n      </table>`;\n  }\n'''

          new_matrix = '''  function renderMatrix() {\n    if (!matrix) return;\n    const columns = builders.flatMap((builder) => boatTypes.map((boatType) => [builder, boatType]));\n\n    matrix.innerHTML = `\n      <table class="admin-matrix">\n        <thead>\n          <tr>\n            <th>Slot</th>\n            <th>Riempimento slot</th>\n            ${columns.map(([builder, type]) => `<th>${builder}<br><small>${type}</small></th>`).join('')}\n          </tr>\n        </thead>\n        <tbody>\n          ${slots.map(([code, label]) => {\n            const info = slotInfo(code);\n            const isInactive = info?.active === false;\n            const totals = columns.reduce((acc, [builder, type]) => {\n              const row = availabilityRow(code, builder, type) || { booked: 0, capacity: 0 };\n              acc.booked += Number(row.booked || 0);\n              acc.capacity += Number(row.capacity || 0);\n              return acc;\n            }, { booked: 0, capacity: 0 });\n            const percentage = totals.capacity > 0\n              ? Math.min(100, Math.round((totals.booked / totals.capacity) * 100))\n              : 0;\n            const fillClass = percentage >= 100 ? ' is-full' : percentage >= 80 ? ' is-high' : percentage >= 50 ? ' is-medium' : '';\n\n            return `\n            <tr>\n              <th>${escapeHtml(info?.label || label)}${isInactive ? '<br><small>CHIUSO</small>' : ''}</th>\n              <td class="admin-matrix__occupancy">\n                <div class="admin-slot-fill${fillClass}" style="--slot-fill:${percentage}%">\n                  <span class="admin-slot-fill__value"><strong>${totals.booked}/${totals.capacity}</strong><span>${percentage}%</span></span>\n                  <span class="admin-slot-fill__track" aria-hidden="true"><span></span></span>\n                </div>\n              </td>\n              ${columns.map(([builder, type]) => {\n                const row = availabilityRow(code, builder, type) || { booked: 0, capacity: 0, remaining: 0 };\n                const noBoats = Number(row.capacity) === 0;\n                const full = !noBoats && Number(row.remaining) <= 0;\n                return `<td class="admin-matrix__cell${full ? ' is-full' : ''}${noBoats ? ' is-empty' : ''}">\n                  <strong>${row.booked}/${row.capacity}</strong>\n                  <small>${isInactive ? 'SLOT CHIUSO' : noBoats ? 'NESSUNA BARCA' : full ? 'COMPLETO' : `${row.remaining} libere`}</small>\n                </td>`;\n              }).join('')}\n            </tr>`;\n          }).join('')}\n        </tbody>\n      </table>`;\n  }\n'''
          replace_once('boat-booking-admin.js', old_matrix, new_matrix, 'renderMatrix')

          replace_once(
              'boat-booking-admin.js',
              '''    renderBookings();\n    syncEditSlotOptions();\n  }\n''',
              '''    renderBookings();\n    syncEditSlotOptions();\n    window.boatBookingAdminData = data;\n    window.dispatchEvent(new CustomEvent('boat-booking-admin:data', { detail: data }));\n  }\n''',
              'admin data event'
          )

          # --- Admin list UX: keep Excel button with other heading actions ---
          replace_once(
              'boat-booking-admin-list-ux.js',
              '''    const exportButton = heading?.querySelector('[data-export-bookings-pdf]');\n    if (heading && refresh && exportButton && !heading.querySelector('[data-admin-section-actions]')) {\n''',
              '''    const exportButton = heading?.querySelector('[data-export-bookings-pdf]');\n    const excelButton = heading?.querySelector('[data-export-bookings-xlsx]');\n    if (heading && refresh && exportButton && !heading.querySelector('[data-admin-section-actions]')) {\n''',
              'excel action lookup'
          )
          replace_once(
              'boat-booking-admin-list-ux.js',
              '''      actions.append(refresh, exportButton);\n''',
              '''      actions.append(refresh, exportButton);\n      if (excelButton) actions.append(excelButton);\n''',
              'excel action append'
          )

          # --- PDF: force occupancy matrix into one landscape page ---
          old_export = '''  function exportMatrix() {\n    const table = matrixData();\n    if (!table || !table.headers.length || !table.rows.length) {\n      window.alert('La tabella di occupazione non è disponibile.');\n      return;\n    }\n\n    const pdf = new SimplePdf(841.89, 595.28);\n    const margin = 34;\n    const usableWidth = pdf.width - margin * 2;\n    const firstColumn = 116;\n    const otherColumn = (usableWidth - firstColumn) / Math.max(1, table.headers.length - 1);\n    const widths = table.headers.map((_, index) => index === 0 ? firstColumn : otherColumn);\n    const headerHeight = 42;\n    const rowHeight = 48;\n    const tableTop = 100;\n    const maxRows = Math.max(1, Math.floor((pdf.height - tableTop - 32 - headerHeight) / rowHeight));\n    const chunks = [];\n    for (let index = 0; index < table.rows.length; index += maxRows) chunks.push(table.rows.slice(index, index + maxRows));\n\n    chunks.forEach((chunk, pageIndex) => {\n      const page = pdf.addPage();\n      pdf.text(page, 'Campionati Italiani Coastal Rowing 2026 - Pesaro', margin, 38, 9, true);\n      pdf.text(page, pageIndex === 0 ? 'Occupazione prove barche per slot' : 'Occupazione prove barche per slot - continuazione', margin, 62, 17, true);\n      pdf.text(page, `Esportato il ${exportStamp()} - valori: prenotate / barche attive censite`, margin, 80, 9);\n\n      let x = margin;\n      table.headers.forEach((header, colIndex) => {\n        const width = widths[colIndex];\n        pdf.rect(page, x, tableTop, width, headerHeight, { fillGray: 0.92, strokeGray: 0.72 });\n        const lines = wrapText(header, width - 10, 8.5).slice(0, 2);\n        lines.forEach((line, lineIndex) => pdf.text(page, line, x + 5, tableTop + 16 + lineIndex * 11, 8.5, true));\n        x += width;\n      });\n\n      chunk.forEach((row, rowIndex) => {\n        const yTop = tableTop + headerHeight + rowIndex * rowHeight;\n        x = margin;\n        row.forEach((cell, colIndex) => {\n          const width = widths[colIndex] || otherColumn;\n          const isFull = /COMPLETO|SLOT CHIUSO|NESSUNA BARCA/i.test(cell);\n          pdf.rect(page, x, yTop, width, rowHeight, { fillGray: isFull ? 0.955 : null, strokeGray: 0.82 });\n          const lines = wrapText(cell, width - 10, colIndex === 0 ? 8.5 : 8).slice(0, 3);\n          lines.forEach((line, lineIndex) => pdf.text(page, line, x + 5, yTop + 15 + lineIndex * 10.5, colIndex === 0 ? 8.5 : 8, lineIndex === 0));\n          x += width;\n        });\n      });\n    });\n\n    downloadBlob(pdf.blob(), `occupazione-slot-prove-barche-${fileStamp()}.pdf`);\n  }\n'''

          new_export = '''  function exportMatrix() {\n    const table = matrixData();\n    if (!table || !table.headers.length || !table.rows.length) {\n      window.alert('La tabella di occupazione non è disponibile.');\n      return;\n    }\n\n    const pdf = new SimplePdf(841.89, 595.28);\n    const margin = 28;\n    const usableWidth = pdf.width - margin * 2;\n    const firstColumn = 92;\n    const occupancyColumn = table.headers.length > 1 ? 94 : 0;\n    const dataColumns = Math.max(1, table.headers.length - (occupancyColumn ? 2 : 1));\n    const otherColumn = (usableWidth - firstColumn - occupancyColumn) / dataColumns;\n    const widths = table.headers.map((_, index) => index === 0 ? firstColumn : index === 1 && occupancyColumn ? occupancyColumn : otherColumn);\n    const tableTop = 88;\n    const headerHeight = 34;\n    const availableRowsHeight = pdf.height - tableTop - headerHeight - 26;\n    const rowHeight = Math.max(30, Math.min(42, availableRowsHeight / Math.max(1, table.rows.length)));\n    const bodyFont = rowHeight < 35 ? 6.7 : 7.4;\n    const firstFont = rowHeight < 35 ? 7.1 : 7.8;\n\n    const page = pdf.addPage();\n    pdf.text(page, 'Campionati Italiani Coastal Rowing 2026 - Pesaro', margin, 28, 8.5, true);\n    pdf.text(page, 'Occupazione prove barche per slot', margin, 51, 16, true);\n    pdf.text(page, `Esportato il ${exportStamp()} - riempimento slot e valori prenotate / barche attive censite`, margin, 70, 8.3);\n\n    let x = margin;\n    table.headers.forEach((header, colIndex) => {\n      const width = widths[colIndex];\n      pdf.rect(page, x, tableTop, width, headerHeight, { fillGray: 0.92, strokeGray: 0.72 });\n      const lines = wrapText(header, width - 8, 7.6).slice(0, 2);\n      lines.forEach((line, lineIndex) => pdf.text(page, line, x + 4, tableTop + 13 + lineIndex * 9.5, 7.6, true));\n      x += width;\n    });\n\n    table.rows.forEach((row, rowIndex) => {\n      const yTop = tableTop + headerHeight + rowIndex * rowHeight;\n      x = margin;\n      row.forEach((cell, colIndex) => {\n        const width = widths[colIndex] || otherColumn;\n        const isFull = /COMPLETO|SLOT CHIUSO|NESSUNA BARCA|100%/i.test(cell);\n        pdf.rect(page, x, yTop, width, rowHeight, { fillGray: isFull ? 0.955 : null, strokeGray: 0.82 });\n        const fontSize = colIndex === 0 ? firstFont : bodyFont;\n        const lines = wrapText(cell, width - 8, fontSize).slice(0, rowHeight < 35 ? 2 : 3);\n        lines.forEach((line, lineIndex) => pdf.text(page, line, x + 4, yTop + 13 + lineIndex * 9.3, fontSize, lineIndex === 0));\n        x += width;\n      });\n    });\n\n    downloadBlob(pdf.blob(), `occupazione-slot-prove-barche-${fileStamp()}.pdf`);\n  }\n'''
          replace_once('boat-booking-pdf-export.js', old_export, new_export, 'single page matrix PDF')

          # --- New admin reports JS: true XLSX + society cards ---
          Path('boat-booking-admin-reports.js').write_text(r'''(() => {
  const excelButton = document.querySelector('[data-export-bookings-xlsx]');
  const societyContainer = document.querySelector('[data-admin-society-report]');
  if (!excelButton && !societyContainer) return;

  const fallbackSlots = new Map([
    ['1400', '14:00–14:20'], ['1430', '14:30–14:50'], ['1500', '15:00–15:20'],
    ['1530', '15:30–15:50'], ['1600', '16:00–16:20'], ['1630', '16:30–16:50'],
    ['1700', '17:00–17:20'], ['1730', '17:30–17:50'], ['1800', '18:00–18:20']
  ]);

  let state = window.boatBookingAdminData || null;

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function slotLabel(code) {
    return (state?.slots || []).find((slot) => slot.code === code)?.label || fallbackSlots.get(code) || code || '—';
  }

  function slotOrder(code) {
    const source = state?.slots || [];
    const item = source.find((slot) => slot.code === code);
    if (item && Number.isFinite(Number(item.sortOrder))) return Number(item.sortOrder);
    return Array.from(fallbackSlots.keys()).indexOf(code);
  }

  function formatDate(value) {
    if (!value) return '';
    try {
      return new Intl.DateTimeFormat('it-IT', {
        timeZone: 'Europe/Rome',
        dateStyle: 'short',
        timeStyle: 'short'
      }).format(new Date(value));
    } catch {
      return String(value);
    }
  }

  function bookingTotal(booking) {
    return (booking.items || []).reduce((sum, item) => sum + Number(item.quantity || 0), 0);
  }

  function itemsSummary(booking) {
    return (booking.items || []).map((item) => {
      const numbers = Array.isArray(item.boatNumbers) && item.boatNumbers.length
        ? ` — ${item.boatNumbers.join(', ')}`
        : '';
      return `${item.builder} ${item.boatType} × ${Number(item.quantity || 0)}${numbers}`;
    }).join(' · ') || 'Nessuna barca';
  }

  function currentFilters() {
    return {
      society: (document.querySelector('[data-filter-society]')?.value || '').trim().toLowerCase(),
      slot: document.querySelector('[data-filter-slot]')?.value || '',
      builder: document.querySelector('[data-filter-builder]')?.value || '',
      type: document.querySelector('[data-filter-type]')?.value || ''
    };
  }

  function matchesFilters(booking, filters) {
    if (filters.society && !String(booking.society || '').toLowerCase().includes(filters.society)) return false;
    if (filters.slot && booking.slotCode !== filters.slot) return false;
    if (filters.builder && !(booking.items || []).some((item) => item.builder === filters.builder)) return false;
    if (filters.type && !(booking.items || []).some((item) => item.boatType === filters.type)) return false;
    return true;
  }

  function visibleBookings() {
    if (!state?.bookings) return [];
    const filters = currentFilters();
    return state.bookings.filter((booking) => matchesFilters(booking, filters));
  }

  function renderSocietyReport() {
    if (!societyContainer) return;
    const bookings = Array.isArray(state?.bookings) ? state.bookings : [];
    if (!bookings.length) {
      societyContainer.innerHTML = '<div class="booking-empty">Nessuna società ha ancora effettuato prenotazioni.</div>';
      return;
    }

    const groups = new Map();
    bookings.forEach((booking) => {
      const displayName = String(booking.society || 'Società').trim() || 'Società';
      const key = displayName.toLocaleLowerCase('it-IT');
      if (!groups.has(key)) groups.set(key, { name: displayName, bookings: [] });
      groups.get(key).bookings.push(booking);
    });

    const cards = Array.from(groups.values())
      .sort((a, b) => a.name.localeCompare(b.name, 'it-IT', { sensitivity: 'base' }))
      .map((group) => {
        const ordered = [...group.bookings].sort((a, b) => {
          const slotDiff = slotOrder(a.slotCode) - slotOrder(b.slotCode);
          return slotDiff || String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
        });
        const totalBoats = ordered.reduce((sum, booking) => sum + bookingTotal(booking), 0);
        const slotsCount = new Set(ordered.map((booking) => booking.slotCode)).size;
        const contacts = Array.from(new Map(ordered.map((booking) => {
          const name = `${booking.contactSurname || ''} ${booking.contactName || ''}`.trim();
          const contact = [name, booking.phone, booking.email].filter(Boolean).join(' · ');
          return [contact.toLocaleLowerCase('it-IT'), contact];
        })).values()).filter(Boolean);

        return `
          <article class="admin-society-card">
            <div class="admin-society-card__head">
              <h3>${escapeHtml(group.name)}</h3>
              <div class="admin-society-card__stats">
                <span class="admin-society-card__stat">${ordered.length} prenotazion${ordered.length === 1 ? 'e' : 'i'}</span>
                <span class="admin-society-card__stat">${slotsCount} slot</span>
                <span class="admin-society-card__stat">${totalBoats} barc${totalBoats === 1 ? 'a' : 'he'}</span>
              </div>
            </div>
            <p class="admin-society-card__contacts"><strong>Referent${contacts.length === 1 ? 'e' : 'i'}:</strong> ${contacts.map(escapeHtml).join('<br>')}</p>
            <div class="admin-society-bookings">
              ${ordered.map((booking) => `
                <div class="admin-society-booking">
                  <strong>${escapeHtml(slotLabel(booking.slotCode))}</strong>
                  <span>${escapeHtml(booking.bookingCode || '')} · ${escapeHtml(`${booking.contactSurname || ''} ${booking.contactName || ''}`.trim())}</span>
                  <span>${escapeHtml(itemsSummary(booking))}</span>
                </div>`).join('')}
            </div>
          </article>`;
      });

    societyContainer.innerHTML = cards.join('');
  }

  function fileStamp() {
    const parts = new Intl.DateTimeFormat('it-IT', {
      timeZone: 'Europe/Rome', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false
    }).formatToParts(new Date());
    const get = (type) => parts.find((part) => part.type === type)?.value || '';
    return `${get('year')}${get('month')}${get('day')}-${get('hour')}${get('minute')}`;
  }

  function xmlEscape(value) {
    return String(value ?? '')
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&apos;');
  }

  function columnName(index) {
    let value = index + 1;
    let name = '';
    while (value > 0) {
      const remainder = (value - 1) % 26;
      name = String.fromCharCode(65 + remainder) + name;
      value = Math.floor((value - 1) / 26);
    }
    return name;
  }

  function excelRows(bookings) {
    const header = [
      'Codice prenotazione', 'Società', 'Cognome referente', 'Nome referente', 'Telefono', 'Email',
      'Codice slot', 'Slot', 'Cantiere', 'Tipo barca', 'Quantità', 'Numeri barche',
      'Totale barche prenotazione', 'Creata il', 'Aggiornata il'
    ];
    const rows = [header];

    [...bookings]
      .sort((a, b) => String(a.society || '').localeCompare(String(b.society || ''), 'it-IT', { sensitivity: 'base' }) || slotOrder(a.slotCode) - slotOrder(b.slotCode))
      .forEach((booking) => {
        const items = booking.items?.length ? booking.items : [null];
        const total = bookingTotal(booking);
        items.forEach((item) => {
          rows.push([
            booking.bookingCode || '', booking.society || '', booking.contactSurname || '', booking.contactName || '',
            booking.phone || '', booking.email || '', booking.slotCode || '', slotLabel(booking.slotCode),
            item?.builder || '', item?.boatType || '', Number(item?.quantity || 0),
            Array.isArray(item?.boatNumbers) ? item.boatNumbers.join(', ') : '', total,
            formatDate(booking.createdAt), formatDate(booking.updatedAt)
          ]);
        });
      });
    return rows;
  }

  function worksheetXml(rows) {
    const lastCell = `${columnName(rows[0].length - 1)}${Math.max(1, rows.length)}`;
    const widths = [18, 30, 20, 18, 18, 30, 13, 18, 14, 14, 11, 24, 18, 20, 20];
    const cols = widths.map((width, index) => `<col min="${index + 1}" max="${index + 1}" width="${width}" customWidth="1"/>`).join('');
    const body = rows.map((row, rowIndex) => {
      const cells = row.map((value, colIndex) => {
        const ref = `${columnName(colIndex)}${rowIndex + 1}`;
        const style = rowIndex === 0 ? ' s="1"' : '';
        if (typeof value === 'number' && Number.isFinite(value)) return `<c r="${ref}"${style} t="n"><v>${value}</v></c>`;
        return `<c r="${ref}"${style} t="inlineStr"><is><t xml:space="preserve">${xmlEscape(value)}</t></is></c>`;
      }).join('');
      return `<row r="${rowIndex + 1}">${cells}</row>`;
    }).join('');

    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:${lastCell}"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${cols}</cols><sheetData>${body}</sheetData><autoFilter ref="A1:${lastCell}"/></worksheet>`;
  }

  function u16(value) {
    const bytes = new Uint8Array(2);
    new DataView(bytes.buffer).setUint16(0, value & 0xffff, true);
    return bytes;
  }

  function u32(value) {
    const bytes = new Uint8Array(4);
    new DataView(bytes.buffer).setUint32(0, value >>> 0, true);
    return bytes;
  }

  function concatBytes(parts) {
    const total = parts.reduce((sum, part) => sum + part.length, 0);
    const out = new Uint8Array(total);
    let offset = 0;
    parts.forEach((part) => { out.set(part, offset); offset += part.length; });
    return out;
  }

  const CRC_TABLE = (() => {
    const table = new Uint32Array(256);
    for (let n = 0; n < 256; n += 1) {
      let c = n;
      for (let k = 0; k < 8; k += 1) c = (c & 1) ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      table[n] = c >>> 0;
    }
    return table;
  })();

  function crc32(bytes) {
    let crc = 0xffffffff;
    for (const byte of bytes) crc = CRC_TABLE[(crc ^ byte) & 0xff] ^ (crc >>> 8);
    return (crc ^ 0xffffffff) >>> 0;
  }

  function dosDateTime(date = new Date()) {
    const year = Math.max(1980, date.getFullYear());
    const dosDate = ((year - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
    const dosTime = (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2);
    return { dosDate, dosTime };
  }

  function zipBlob(files) {
    const encoder = new TextEncoder();
    const localParts = [];
    const centralParts = [];
    let offset = 0;
    const stamp = dosDateTime();

    files.forEach(([name, content]) => {
      const nameBytes = encoder.encode(name);
      const dataBytes = encoder.encode(content);
      const crc = crc32(dataBytes);
      const localHeader = concatBytes([
        u32(0x04034b50), u16(20), u16(0), u16(0), u16(stamp.dosTime), u16(stamp.dosDate),
        u32(crc), u32(dataBytes.length), u32(dataBytes.length), u16(nameBytes.length), u16(0)
      ]);
      const localRecord = concatBytes([localHeader, nameBytes, dataBytes]);
      localParts.push(localRecord);

      const centralHeader = concatBytes([
        u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(stamp.dosTime), u16(stamp.dosDate),
        u32(crc), u32(dataBytes.length), u32(dataBytes.length), u16(nameBytes.length), u16(0), u16(0),
        u16(0), u16(0), u32(0), u32(offset)
      ]);
      centralParts.push(concatBytes([centralHeader, nameBytes]));
      offset += localRecord.length;
    });

    const centralDirectory = concatBytes(centralParts);
    const endRecord = concatBytes([
      u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
      u32(centralDirectory.length), u32(offset), u16(0)
    ]);

    return new Blob([...localParts, centralDirectory, endRecord], {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    });
  }

  function buildXlsx(rows) {
    const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
    const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
    const workbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Prenotazioni" sheetId="1" r:id="rId1"/></sheets></workbook>`;
    const workbookRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
    const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;

    return zipBlob([
      ['[Content_Types].xml', contentTypes],
      ['_rels/.rels', rootRels],
      ['xl/workbook.xml', workbook],
      ['xl/_rels/workbook.xml.rels', workbookRels],
      ['xl/styles.xml', styles],
      ['xl/worksheets/sheet1.xml', worksheetXml(rows)]
    ]);
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function exportExcel() {
    const bookings = visibleBookings();
    if (!bookings.length) {
      window.alert('Nessuna prenotazione corrisponde ai filtri correnti.');
      return;
    }
    const rows = excelRows(bookings);
    downloadBlob(buildXlsx(rows), `prenotazioni-prove-barche-${fileStamp()}.xlsx`);
  }

  window.addEventListener('boat-booking-admin:data', (event) => {
    state = event.detail || null;
    renderSocietyReport();
  });

  excelButton?.addEventListener('click', exportExcel);
  if (state) renderSocietyReport();
})();
