name: Apply food map icons

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/apply-food-map-icons.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Applica patch
        run: python .github/scripts/apply-food-map-icons.py

      - name: Verifica JavaScript e diff
        run: |
          node --check vivi-pesaro-food.js
          git diff --check

      - name: Commit e pulizia file temporanei
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vivi-pesaro.html vivi-pesaro-food.js vivi-pesaro.css
          git rm .github/scripts/apply-food-map-icons.py .github/workflows/apply-food-map-icons.yml
          git commit -m "Aggiungi icone e dettaglio hover alla mappa locali"
          git push origin HEAD:develop
