name: Race course map dev

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/race-course-map-dev.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply race course map
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('info-gare.html')
          html = page.read_text(encoding='utf-8')
          fragment = Path('race-course-map-fragment.html').read_text(encoding='utf-8').rstrip()

          start_marker = '      <section class="info-section" id="campo-gara"'
          end_marker = '      <section class="info-section" id="logistica"'
          start = html.index(start_marker)
          end = html.index(end_marker, start)
          html = html[:start] + fragment + '\n\n' + html[end:]

          leaflet_css = '  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3yn5jkP8eAHgzK/EDhIGSz4e2mMZc=" crossorigin="">\n'
          map_css = '  <link rel="stylesheet" href="race-course-map.css">\n'
          if 'race-course-map.css' not in html:
              anchor = '  <link rel="stylesheet" href="info-gare-polish.css">\n'
              html = html.replace(anchor, anchor + leaflet_css + map_css, 1)

          leaflet_js = '  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>\n'
          map_js = '  <script src="race-course-map.js" defer></script>\n'
          if 'race-course-map.js' not in html:
              anchor = '  <script src="nav-submenu.js" defer></script>\n'
              html = html.replace(anchor, leaflet_js + map_js + anchor, 1)

          page.write_text(html, encoding='utf-8')
          Path('race-course-map-fragment.html').unlink()
          PY

      - name: Validate
        run: |
          node --check race-course-map.js
          grep -q 'data-race-course-map' info-gare.html
          grep -q 'PR3 II ~1.700 m' info-gare.html
          grep -q 'campo-gara-pesaro-2026.pdf' info-gare.html
          npm run build

      - name: Commit feature and cleanup
        run: |
          rm .github/workflows/race-course-map-dev.yml
          git config user.name "Fabio"
          git config user.email "f.giustiniani@canottieripesaro.it"
          git add -A
          git commit -m "Rende interattiva la mappa del campo gara"
          git push origin HEAD:develop
