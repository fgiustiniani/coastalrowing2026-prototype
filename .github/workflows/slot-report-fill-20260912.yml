name: Slot report occupancy indicator

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/slot-report-fill-20260912.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Apply slot report occupancy changes
        run: python .github/scripts/slot-report-fill-20260912.py

      - name: Validate
        run: |
          node --check boat-booking-report-menu.js
          git diff --check

      - name: Commit and cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-prenotazioni-barche.html boat-booking-report-menu.js
          git rm .github/workflows/slot-report-fill-20260912.yml .github/scripts/slot-report-fill-20260912.py
          git commit -m "Aggiunge riempimento al report per slot"
          git push origin HEAD:develop
