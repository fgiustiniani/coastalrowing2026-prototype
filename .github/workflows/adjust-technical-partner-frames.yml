name: Adjust technical partner frames

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/adjust-technical-partner-frames.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Regola solo la larghezza delle card
        shell: python
        env:
          OLD_BLOCK: 
          NEW_BLOCK: 
        run: |
          import os, base64
          from pathlib import Path
          p = Path('home-overrides.css')
          s = p.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_BLOCK']).decode('utf-8')
          new = base64.b64decode(os.environ['NEW_BLOCK']).decode('utf-8')
          if old not in s:
              raise SystemExit('Blocco partner tecnici non trovato')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit e pulizia
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-overrides.css
          git rm .github/workflows/adjust-technical-partner-frames.yml
          git commit -m "Mantieni dimensione loghi partner tecnici"
          git push origin HEAD:develop
