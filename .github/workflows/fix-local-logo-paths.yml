name: Fix local logo paths

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/fix-local-logo-paths.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Aggiorna percorsi loghi
        run: |
          sed -i 's#assets/logos/partners/Ristorantino.svg#assets/logos/locali/Ristorantino.svg#g' vivi-pesaro.html
          sed -i 's#assets/logos/Sponsor/Piazzetta.svg#assets/logos/locali/Piazzetta.svg#g' vivi-pesaro.html
      - name: Commit e pulizia
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vivi-pesaro.html
          git rm .github/workflows/fix-local-logo-paths.yml
          git commit -m "Usa i loghi locali per Ristorantino e In Piazzetta"
          git push origin HEAD:develop
