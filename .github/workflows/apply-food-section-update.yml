name: Apply food section update

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/apply-food-section-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Aggiorna sezione Dove mangiare
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path('vivi-pesaro.html')
          css_path = Path('vivi-pesaro-list.css')
          html = html_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          html = html.replace(
              '            <p class="section-kicker">Dove mangiare e bere</p>\n            <h2 id="food-title">Alcuni indirizzi utili</h2>',
              '            <h2 id="food-title">Dove mangiare e bere</h2>'
          )
          html = html.replace('data-food-count aria-live="polite">7 locali</p>', 'data-food-count aria-live="polite">9 locali</p>')
          html = html.replace('assets/logos/locali/Botanic.png', 'assets/logos/locali/Botanic.jpg')

          marker = '''            <article class="food-place" data-place-id="donna-amalia" data-categories="ristorante pizzeria">'''
          cards = '''            <article class="food-place" data-place-id="ristorantino" data-categories="ristorante">
              <div class="food-place__main">
                <a class="food-place__logo-link" href="https://bagnitino.it/" target="_blank" rel="noopener noreferrer" aria-label="Apri il sito di Ristorantino">
                  <img class="food-place__logo" src="assets/logos/partners/Ristorantino.svg" alt="Logo Ristorantino" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false">
                  <span class="food-place__logo-fallback" hidden>Ristorantino</span>
                </a>
                <div class="food-place__content">
                  <div class="food-place__categories" aria-label="Tipologie">
                    <span class="food-place__category">Ristorante</span>
                  </div>
                  <div class="food-place__title-row">
                    <h3 class="food-place__name">
                      <a class="food-place__name-link" href="https://bagnitino.it/" target="_blank" rel="noopener noreferrer">Ristorantino <span aria-hidden="true">↗</span></a>
                    </h3>
                    <p class="food-place__description">Ristorante sul mare all’interno di Bagni Tino, direttamente sul campo gara.</p>
                  </div>
                  <div class="food-place__addresses" aria-label="Indirizzi di Ristorantino">
                    <a class="food-place__address" data-location-id="ristorantino-trieste" data-lat="43.91724" data-lng="12.91302" href="https://maps.app.goo.gl/ztnkc7XbV14zxHnn8" target="_blank" rel="noopener noreferrer">
                      <span class="food-place__address-label">Viale Trieste, 61121 · Campo gara</span>
                      <small>Apri su Google Maps ↗</small>
                    </a>
                  </div>
                </div>
              </div>
            </article>

            <article class="food-place" data-place-id="in-piazzetta" data-categories="ristorante">
              <div class="food-place__main">
                <a class="food-place__logo-link" href="https://inpiazzetta.it/" target="_blank" rel="noopener noreferrer" aria-label="Apri il sito di In Piazzetta">
                  <img class="food-place__logo" src="assets/logos/Sponsor/Piazzetta.svg" alt="Logo In Piazzetta" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false">
                  <span class="food-place__logo-fallback" hidden>In Piazzetta</span>
                </a>
                <div class="food-place__content">
                  <div class="food-place__categories" aria-label="Tipologie">
                    <span class="food-place__category">Ristorante</span>
                  </div>
                  <div class="food-place__title-row">
                    <h3 class="food-place__name">
                      <a class="food-place__name-link" href="https://inpiazzetta.it/" target="_blank" rel="noopener noreferrer">In Piazzetta <span aria-hidden="true">↗</span></a>
                    </h3>
                    <p class="food-place__description">Piatti della tradizione del territorio, gastronomia, aperitivi e apericena nel centro storico.</p>
                  </div>
                  <div class="food-place__addresses" aria-label="Indirizzi di In Piazzetta">
                    <a class="food-place__address" data-location-id="in-piazzetta-cattaneo" data-lat="43.9071798" data-lng="12.9112896" href="https://maps.app.goo.gl/Kz8gMbYaToVUQ5xE9" target="_blank" rel="noopener noreferrer">
                      <span class="food-place__address-label">Via Carlo Cattaneo 37 · Centro storico</span>
                      <small>Apri su Google Maps ↗</small>
                    </a>
                  </div>
                </div>
              </div>
            </article>

'''
          if 'data-place-id="ristorantino"' not in html:
              if marker not in html:
                  raise SystemExit('Marker Donna Amalia non trovato')
              html = html.replace(marker, cards + marker, 1)

          old_logo = '''.food-place__logo-link {
  display: grid;
  place-items: center;
  width: 58px;
  height: 58px;
  padding: 6px;
  overflow: hidden;
  border: 1px solid rgba(16,34,53,.1);
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 7px 16px rgba(4,17,31,.06);
  text-decoration: none;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}

.food-place__logo-link:hover,
.food-place__logo-link:focus-visible {
  border-color: rgba(31,99,135,.34);
  box-shadow: 0 9px 20px rgba(4,17,31,.1);
  transform: translateY(-1px);
}'''
          new_logo = '''.food-place__logo-link {
  display: grid;
  place-items: center;
  width: 58px;
  height: 58px;
  padding: 0;
  overflow: hidden;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  text-decoration: none;
  transition: transform .15s ease;
}

.food-place__logo-link:hover,
.food-place__logo-link:focus-visible {
  border-color: transparent;
  box-shadow: none;
  transform: translateY(-1px);
}'''
          if old_logo in css:
              css = css.replace(old_logo, new_logo, 1)
          else:
              raise SystemExit('Blocco CSS logo non trovato')

          css = css.replace('    padding: 5px;\n    border-radius: 12px;', '    padding: 0;\n    border-radius: 0;')

          html_path.write_text(html, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Commit e pulizia workflow temporaneo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vivi-pesaro.html vivi-pesaro-list.css
          git rm .github/workflows/apply-food-section-update.yml
          git commit -m "Aggiorna sezione Dove mangiare con nuovi locali"
          git push origin HEAD:develop
