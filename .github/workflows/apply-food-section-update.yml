name: Apply food section update

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/apply-food-section-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Applica aggiornamento
        run: python scripts/apply-food-update.py

      - name: Commit e pulizia file temporanei
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vivi-pesaro.html vivi-pesaro-list.css
          git rm .github/workflows/apply-food-section-update.yml scripts/apply-food-update.py
          git commit -m "Aggiorna sezione Dove mangiare con nuovi locali"
          git push origin HEAD:develop
