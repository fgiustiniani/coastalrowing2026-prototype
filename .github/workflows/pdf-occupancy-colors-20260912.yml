name: PDF occupancy colors

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/pdf-occupancy-colors-20260912.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Apply PDF occupancy colors
        run: python .github/scripts/pdf-occupancy-colors-20260912.py

      - name: Validate
        run: |
          node --check boat-booking-pdf-export.js
          node --check boat-booking-report-menu.js
          git diff --check

      - name: Commit and cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boat-booking-pdf-export.js boat-booking-report-menu.js
          git rm .github/workflows/pdf-occupancy-colors-20260912.yml .github/scripts/pdf-occupancy-colors-20260912.py
          git commit -m "Aggiunge colori occupazione agli export PDF"
          git push origin HEAD:develop
