name: Add technical partners

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/add-technical-partners.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Add partner tecnici
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          anchor = '              <a class="partner-logo" href="https://www.farmaciagrossini.it/" target="_blank" rel="noopener noreferrer"><img src="assets/logos/partners/Rossini.svg" alt="Rossini"></a>\n'
          addition = (
              '              <a class="partner-logo" href="https://swiftracing.com/" target="_blank" rel="noopener noreferrer"><img src="assets/logos/partners/Swift.jpg" alt="Swift"></a>\n'
              '              <a class="partner-logo" href="https://www.lovaracingboats.it/" target="_blank" rel="noopener noreferrer"><img src="assets/logos/partners/LOVA.png" alt="LOVA"></a>\n'
              '              <a class="partner-logo" href="https://dibi-online.com/" target="_blank" rel="noopener noreferrer"><img src="assets/logos/partners/DIBI.jpg" alt="DIBI"></a>\n'
          )
          if 'assets/logos/partners/Swift.jpg' not in s:
              if anchor not in s:
                  raise SystemExit('Anchor Rossini non trovato')
              s = s.replace(anchor, anchor + addition, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit e pulizia
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/add-technical-partners.yml
          git commit -m "Aggiungi Swift LOVA e DIBI tra i partner tecnici"
          git push origin HEAD:develop
