name: Fix Ristorantino map point

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/fix-ristorantino-map.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Aggiorna posizione Ristorantino
        shell: python
        run: |
          from pathlib import Path
          path = Path('vivi-pesaro.html')
          text = path.read_text(encoding='utf-8')
          old = 'data-location-id="ristorantino-trieste" data-lat="43.920889" data-lng="12.9097882" href="https://maps.app.goo.gl/NqFt3R8zN4KV8hw97"'
          new = 'data-location-id="ristorantino-trieste" data-lat="43.9220430" data-lng="12.9067361" href="https://maps.app.goo.gl/NqFt3R8zN4KV8hw97"'
          if old not in text:
              raise SystemExit('Posizione Ristorantino attuale non trovata')
          text = text.replace(old, new, 1)
          text = text.replace('Viale Trieste, 61121 · Campo gara', 'Viale Trieste 296 · Campo gara', 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit e pulizia
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vivi-pesaro.html
          git rm .github/workflows/fix-ristorantino-map.yml
          git commit -m "Correggi posizione Ristorantino sulla mappa"
          git push origin HEAD:develop
