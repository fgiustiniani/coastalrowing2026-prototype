name: Mobile exports and society filter

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/mobile-exports-society-filter-20260912.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Apply changes
        run: python .github/scripts/mobile-exports-society-filter-20260912.py

      - name: Validate
        run: |
          node --check boat-booking-admin-reports.js
          node --check boat-booking-report-menu.js
          node --check boat-booking-admin-list-ux.js
          git diff --check

      - name: Commit and cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-prenotazioni-barche.html boat-booking-admin-reports.js boat-booking-report-menu.js boat-booking-admin-list-ux.js
          git rm .github/workflows/mobile-exports-society-filter-20260912.yml .github/scripts/mobile-exports-society-filter-20260912.py
          git commit -m "Migliora report società e layout mobile"
          git push origin HEAD:develop
