name: Debug historical 2025 data

on:
  push:
    branches:
      - feature/admin-societa-iscritte
    paths:
      - .github/workflows/debug-historical-2025.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Search Common Crawl for 25CICR
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          def get(url, timeout=30):
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read().decode("utf-8", errors="replace")

          info = json.loads(get("https://index.commoncrawl.org/collinfo.json"))
          indexes = [x["id"] for x in info if x["id"].startswith("CC-MAIN-2025")][:12]
          print("INDEXES", indexes)

          patterns = [
              "canottaggioservice.canottaggio.net/*25CICR*",
              "www.canottaggio.net/*25CICR*",
              "canottaggio.net/*25CICR*",
          ]
          for idx in indexes:
              for pattern in patterns:
                  q = "https://index.commoncrawl.org/" + idx + "-index?" + urllib.parse.urlencode({
                      "url": pattern,
                      "output": "json",
                      "filter": "status:200",
                      "matchType": "domain",
                  })
                  try:
                      payload = get(q, 20).strip()
                      if payload:
                          print("===FOUND===", idx, pattern)
                          print(payload[:30000])
                  except Exception as exc:
                      print("ERR", idx, pattern, repr(exc))
          PY
