name: Debug historical 2025 data

on:
  push:
    branches:
      - feature/admin-societa-iscritte
    paths:
      - .github/workflows/debug-historical-2025.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect 2025 event menu markup
        run: |
          python - <<'PY'
          import html
          import json
          import re
          import urllib.request

          url = "https://canottaggioservice.canottaggio.net/menu_reg.php?k1=N&reg=25CICR&stagione=2025"
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (compatible; CoastalRowingPesaro2026-debug/1.0)",
              "Accept": "text/html,application/xhtml+xml",
          })
          with urllib.request.urlopen(req, timeout=20) as response:
              body = response.read().decode("latin1", errors="replace")
              print("MENU", response.status, response.geturl(), len(body))

          print("===LINES===")
          for i, line in enumerate(body.splitlines(), 1):
              upper = line.upper()
              if any(term in upper for term in ["25CICR", "DATI/", "STATIST", "PROGRAMMA", "RISULT", "SOCIET", "ISCRIT"]):
                  cleaned = re.sub(r"\\s+", " ", line).strip()
                  print(f"{i}: {cleaned}")

          print("===ATTRS===")
          attrs = re.findall(r'(?:href|action|src)\\s*=\\s*["\\\']([^"\\\']+)["\\\']', body, flags=re.I)
          for item in attrs:
              print(html.unescape(item))
          PY
