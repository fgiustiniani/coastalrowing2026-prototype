name: Debug historical 2025 data

on:
  push:
    branches:
      - feature/admin-societa-iscritte
    paths:
      - .github/workflows/debug-historical-2025.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Search Common Crawl for 25CICR assets
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          indexes = [
              "CC-MAIN-2025-43",
              "CC-MAIN-2025-47",
              "CC-MAIN-2025-51",
              "CC-MAIN-2026-04",
          ]
          patterns = [
              "canottaggioservice.canottaggio.net/*25CICR*",
              "www.canottaggio.net/*25CICR*",
              "canottaggio.net/*25CICR*",
          ]

          for index in indexes:
              for pattern in patterns:
                  params = urllib.parse.urlencode({
                      "url": pattern,
                      "output": "json",
                      "filter": "status:200",
                      "fl": "timestamp,url,mime,status,digest,length,offset,filename",
                      "matchType": "domain"
                  })
                  url = f"https://index.commoncrawl.org/{index}-index?{params}"
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          data = r.read().decode("utf-8", errors="replace")
                      print("===QUERY===", index, pattern)
                      for line in data.splitlines():
                          if "25CICR" in line.upper():
                              print(line)
                  except Exception as exc:
                      print("===ERROR===", index, pattern, repr(exc))
          PY
