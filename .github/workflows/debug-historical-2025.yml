name: Debug historical 2025 data

on:
  push:
    branches:
      - feature/admin-societa-iscritte
    paths:
      - .github/workflows/debug-historical-2025.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch and parse CanottaggioService 2025
        run: |
          python - <<'PY'
          import html
          import json
          import re
          import urllib.request

          urls = [
              "https://canottaggioservice.canottaggio.net/dati/pis25CICR.html",
              "https://canottaggioservice.canottaggio.net/dati/sts25CICR.html",
          ]

          def cell_text(value):
              value = re.sub(r"<br\\s*/?>", "\n", value, flags=re.I)
              value = re.sub(r"</(?:p|div|li)>", "\n", value, flags=re.I)
              value = re.sub(r"<[^>]*>", " ", value)
              value = html.unescape(value)
              value = re.sub(r"[ \\t\\f\\v]+", " ", value)
              value = re.sub(r" *\\n *", "\n", value)
              return value.strip()

          for url in urls:
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (compatible; CoastalRowingPesaro2026-debug/1.0)",
                  "Accept": "text/html,application/xhtml+xml",
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read().decode("latin1", errors="replace")
                      final_url = response.geturl()
                      status = response.status
              except Exception as exc:
                  print("===RESULT===")
                  print(json.dumps({"url": url, "error": str(exc)}, ensure_ascii=False))
                  continue

              rows = []
              for row_html in re.findall(r"<tr\\b[^>]*>([\\s\\S]*?)</tr>", body, flags=re.I):
                  cells = [
                      cell_text(cell)
                      for _, cell in re.findall(r"<(td|th)\\b[^>]*>([\\s\\S]*?)</\\1>", row_html, flags=re.I)
                  ]
                  if cells:
                      rows.append(cells)

              header_index = -1
              for i, cells in enumerate(rows):
                  joined = " ".join(cells).upper()
                  if "SOCIET" in joined and "ATLETI" in joined and ("FISICI" in joined or "ISCRITTI" in joined):
                      header_index = i
                      break

              payload = {
                  "url": url,
                  "status": status,
                  "final_url": final_url,
                  "bytes": len(body.encode("latin1", errors="replace")),
                  "header_index": header_index,
                  "header": rows[header_index] if header_index >= 0 else None,
                  "rows": rows[header_index + 1:] if header_index >= 0 else rows[:30],
              }
              print("===RESULT===")
              print(json.dumps(payload, ensure_ascii=False))
          PY
