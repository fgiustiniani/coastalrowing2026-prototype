name: Debug historical 2025 data

on:
  push:
    branches:
      - feature/admin-societa-iscritte
    paths:
      - .github/workflows/debug-historical-2025.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect program markup
        run: |
          python - <<'PY'
          import urllib.request
          url = "https://canottaggioservice.canottaggio.net/dati/prx25CICR.html"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=20) as r:
              body = r.read().decode("latin1", errors="replace")
          print("bytes", len(body))
          for needle in ["NETTUNO TS", "SATURNIA CC", "PULLINO SN"]:
              pos = body.upper().find(needle)
              print("===NEEDLE===", needle, pos)
              if pos >= 0:
                  print(body[max(0,pos-1800):pos+4200])
                  break
          PY
