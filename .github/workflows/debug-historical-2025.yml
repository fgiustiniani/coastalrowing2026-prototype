name: Debug historical 2025 data

on:
  push:
    branches:
      - feature/admin-societa-iscritte
    paths:
      - .github/workflows/debug-historical-2025.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reconstruct physical athletes from program
        run: |
          python - <<'PY'
          import collections
          import html
          import json
          import re
          import urllib.request

          url = "https://canottaggioservice.canottaggio.net/dati/prx25CICR.html"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=20) as r:
              body = r.read().decode("latin1", errors="replace")

          def txt(fragment):
              fragment = re.sub(r"<br\\s*/?>", "\n", fragment, flags=re.I)
              fragment = re.sub(r"<[^>]*>", "", fragment)
              fragment = html.unescape(fragment)
              fragment = fragment.replace("\r", "")
              fragment = re.sub(r"[ \\t]+", " ", fragment)
              fragment = re.sub(r" *\n *", "\n", fragment)
              return fragment.strip()

          cells = re.findall(r"<td\\b[^>]*class=['\"]t1['\"][^>]*>([\\s\\S]*?)</td>", body, flags=re.I)
          athletes = collections.defaultdict(set)
          crews = collections.Counter()
          mixed = 0
          failed = []

          for fragment in cells:
              lines = [x.strip() for x in txt(fragment).split("\n") if x.strip()]
              if len(lines) < 3:
                  continue

              team_line = lines[1]
              tm = re.match(r"^(.*)\\((\\d+)(?:\\s+Misto)?\\)$", team_line, flags=re.I)
              if not tm:
                  failed.append(lines[:5])
                  continue

              main_team = tm.group(1).strip()
              is_mixed = "MISTO" in team_line.upper()
              if is_mixed:
                  mixed += 1
              crews[main_team] += 1

              footnotes = {}
              for line in lines:
                  fm = re.match(r"^\\((\\d+)\\)\\s+(.+)$", line)
                  if fm:
                      footnotes[fm.group(1)] = fm.group(2).strip()

              for line in lines[2:]:
                  if line.startswith(".") or re.match(r"^\\(\\d+\\)\\s+", line):
                      continue
                  if not re.search(r"\\([A-Z0-9]+\\)", line):
                      continue

                  partner = None
                  pm = re.search(r"\\s+\\((\\d+)\\)\\s*$", line)
                  if pm:
                      partner = pm.group(1)
                      line = line[:pm.start()].rstrip()

                  # strip category marker, age, and cox marker
                  name = re.sub(r"\\([A-Z0-9]+\\)", "", line)
                  name = re.sub(r"\\s+\\d+\\s*$", "", name)
                  name = re.sub(r"\\s*-?Tim\\.?\\s*$", "", name, flags=re.I)
                  name = re.sub(r"\\s+", " ", name).strip(" -")

                  if not name or len(name) < 3:
                      continue
                  team = footnotes.get(partner, main_team) if partner else main_team
                  athletes[team].add(name.upper())

          print("CELLS", len(cells), "TEAMS", len(athletes), "MIXED", mixed, "FAILED", len(failed))
          print("UNIQUE_TOTAL", sum(len(v) for v in athletes.values()))
          print("HAS_RISERVE", "RISERVE" in body.upper())
          print("===COUNTS===")
          for team, names in sorted(athletes.items(), key=lambda kv: (-len(kv[1]), kv[0])):
              print(json.dumps({"team": team, "athletes": len(names), "crews_as_main": crews[team]}, ensure_ascii=False))
          print("===FAILED===")
          for item in failed[:20]:
              print(json.dumps(item, ensure_ascii=False))
          PY
