name: Debug historical 2025 data

on:
  push:
    branches:
      - feature/admin-societa-iscritte
    paths:
      - .github/workflows/debug-historical-2025.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect historical results page
        run: |
          python - <<'PY'
          import html
          import re
          import urllib.parse
          import urllib.request

          base = "https://canottaggioservice.canottaggio.net/"
          url = base + "cs_vedi_ris_nw.php?regata=25CICR"
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (compatible; CoastalRowingPesaro2026-debug/1.0)",
              "Accept": "text/html,application/xhtml+xml",
          })
          with urllib.request.urlopen(req, timeout=20) as response:
              body = response.read().decode("latin1", errors="replace")
              print("PAGE", response.status, response.geturl(), len(body))

          print("===LINES===")
          for i, line in enumerate(body.splitlines(), 1):
              upper = line.upper()
              if any(term in upper for term in ["25CICR", "DATI/", "STATIST", "PROGRAMMA", "RISULT", "SOCIET", "ISCRIT", "ATLETI", "EQUIPAGGI"]):
                  print(f"{i}: {re.sub(r'\\s+', ' ', line).strip()}")

          print("===LINKS===")
          for match in re.finditer(r'href\\s*=\\s*(["\\\'])(.*?)\\1', body, flags=re.I):
              href = html.unescape(match.group(2))
              print(urllib.parse.urljoin(url, href))
          PY
