name: Debug historical 2025 data

on:
  push:
    branches:
      - feature/admin-societa-iscritte
    paths:
      - .github/workflows/debug-historical-2025.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reconstruct all registered crews
        run: |
          python - <<'PY'
          import collections
          import html
          import json
          import re
          import urllib.request

          url = "https://canottaggioservice.canottaggio.net/dati/prx25CICR.html"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=20) as r:
              body = r.read().decode("latin1", errors="replace")

          def txt(fragment):
              fragment = re.sub(r"<br[^>]*>", "\n", fragment, flags=re.I)
              fragment = re.sub(r"<[^>]*>", "", fragment)
              fragment = html.unescape(fragment).replace("\r", "")
              fragment = re.sub(r"[ \t]+", " ", fragment)
              fragment = re.sub(r" *\n *", "\n", fragment)
              return fragment.strip()

          all_cells = re.findall(r"<td[^>]*class=['\"](t[12])['\"][^>]*>(.*?)</td>", body, flags=re.I | re.S)
          class_counts = collections.Counter(cls.lower() for cls,_ in all_cells)
          unique = collections.defaultdict(set)
          entries = collections.Counter()
          crews = collections.Counter()
          by_class = collections.Counter()
          failed = []

          for cls, fragment in all_cells:
              lines = [x.strip() for x in txt(fragment).split("\n") if x.strip()]
              if len(lines) < 3:
                  continue
              team_line = lines[1]
              tm = re.match(r"^(.*)[(]([0-9]+)(?: +Misto)?[)]$", team_line, flags=re.I)
              if not tm:
                  failed.append({"class":cls,"lines":lines[:6]})
                  continue
              main_team = tm.group(1).strip()
              crews[main_team] += 1
              by_class[cls.lower()] += 1

              footnotes = {}
              for line in lines:
                  fm = re.match(r"^[(]([0-9]+)[)] +(.+)$", line)
                  if fm:
                      footnotes[fm.group(1)] = fm.group(2).strip()

              for line in lines[2:]:
                  if line.startswith(".") or re.match(r"^[(][0-9]+[)] +", line):
                      continue
                  if not re.search(r"[(][A-Z0-9]+[)]", line):
                      continue

                  partner = None
                  pm = re.search(r" +[(]([0-9]+)[)] *$", line)
                  if pm:
                      partner = pm.group(1)
                      line = line[:pm.start()].rstrip()

                  name = re.sub(r"[(][A-Z0-9]+[)]", "", line)
                  name = re.sub(r" +[0-9]+ *$", "", name)
                  name = re.sub(r" +-?Tim[.]? *$", "", name, flags=re.I)
                  name = re.sub(r" +", " ", name).strip(" -")
                  if not name or len(name) < 3:
                      continue

                  team = footnotes.get(partner, main_team) if partner else main_team
                  unique[team].add(name.upper())
                  entries[team] += 1

          print("CELL_CLASS_COUNTS", json.dumps(class_counts))
          print("PARSED_CREWS_BY_CLASS", json.dumps(by_class))
          print("PARSED_CREWS_TOTAL", sum(crews.values()))
          print("UNIQUE_TOTAL", sum(len(v) for v in unique.values()))
          print("ENTRY_TOTAL", sum(entries.values()))
          print("FAILED", len(failed))
          print("===COUNTS===")
          teams = sorted(set(unique) | set(entries), key=lambda t: (-len(unique[t]), t))
          for team in teams:
              print(json.dumps({
                  "team": team,
                  "physical": len(unique[team]),
                  "entries": entries[team],
                  "crews": crews[team]
              }, ensure_ascii=False))
          print("===FAILED_ROWS===")
          for item in failed[:30]:
              print(json.dumps(item, ensure_ascii=False))
          PY
