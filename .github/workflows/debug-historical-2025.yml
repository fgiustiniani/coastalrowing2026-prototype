name: Debug historical 2025 data

on:
  push:
    branches:
      - feature/admin-societa-iscritte
    paths:
      - .github/workflows/debug-historical-2025.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check web archives for 2025 society list
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          candidates = [
              "https://canottaggioservice.canottaggio.net/dati/pis25CICR.html",
              "https://www.canottaggio.net/gen_si_iscr.php",
              "https://www.canottaggio.net/elenco_societa_iscritte.php",
          ]
          for target in candidates:
              cdx = "https://web.archive.org/cdx/search/cdx?" + urllib.parse.urlencode({
                  "url": target,
                  "output": "json",
                  "filter": "statuscode:200",
                  "fl": "timestamp,original,statuscode,mimetype,digest",
                  "from": "2025",
                  "to": "2025",
                  "collapse": "digest"
              })
              try:
                  req = urllib.request.Request(cdx, headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      payload = r.read().decode("utf-8", errors="replace")
                  print("===CDX===", target)
                  print(payload[:20000])
              except Exception as exc:
                  print("===ERROR===", target, repr(exc))
          PY
