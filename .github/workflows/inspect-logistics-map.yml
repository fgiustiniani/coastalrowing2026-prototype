name: Inspect logistics map calibration

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/inspect-logistics-map.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate calibration and build
        run: |
          python - <<'PY'
          import re, subprocess
          old=subprocess.check_output(['git','show','1eb9f6b4035e7b0a2a30c807e947d372f12e1825:info-gare.html'],text=True)
          cur=open('info-gare.html',encoding='utf-8').read()
          pat=r'data-logistics-point="([^"]+)"[^>]*data-map-x="([^"]+)"[^>]*data-map-y="([^"]+)"'
          def pts(s): return {m[0]:(m[1],m[2]) for m in re.findall(pat,s)}
          op,cp=pts(old),pts(cur)
          for key,val in op.items():
              if key=='6': continue
              assert cp.get(key)==val, f'hotspot {key} changed: {val} -> {cp.get(key)}'
          assert cp['6']==('0.180462','0.393479'), cp['6']
          lpat=r'data-logistics-legend-point="([^"]+)"[^>]*data-logistics-target="([^"]+)"[^>]*style="--legend-x:([^%]+)%;--legend-y:([^%]+)%'
          assert re.findall(lpat,cur)==re.findall(lpat,old), 'legend coordinates changed'
          assert 'translate(0.0285%, -15.6913%) scale(1.15696, 1.15657)' in open('logistics-map.css',encoding='utf-8').read()
          print('CALIBRATION_OK')
          PY
          npm ci
          npm run build
      - name: Prepare old map
        run: git show 1eb9f6b4035e7b0a2a30c807e947d372f12e1825:assets/maps/mappa-interattiva.webp > /tmp/old-map.webp
      - name: Install image tools
        run: python -m pip install --quiet pillow numpy opencv-python-headless
      - name: Compare maps
        run: |
          python - <<'PY'
          import cv2, numpy as np, json
          old_path='/tmp/old-map.webp'
          new_path='assets/maps/mappa-interattiva.webp'
          old=cv2.imread(old_path, cv2.IMREAD_COLOR)
          new=cv2.imread(new_path, cv2.IMREAD_COLOR)
          if old is None or new is None:
              raise SystemExit('Unable to read one of the maps')
          ho,wo=old.shape[:2]; hn,wn=new.shape[:2]
          print('OLD_SIZE',wo,ho)
          print('NEW_SIZE',wn,hn)

          # ORB registration old -> new
          g1=cv2.cvtColor(old,cv2.COLOR_BGR2GRAY)
          g2=cv2.cvtColor(new,cv2.COLOR_BGR2GRAY)
          orb=cv2.ORB_create(nfeatures=8000, scaleFactor=1.15, nlevels=8)
          k1,d1=orb.detectAndCompute(g1,None)
          k2,d2=orb.detectAndCompute(g2,None)
          if d1 is None or d2 is None:
              raise SystemExit('No descriptors')
          bf=cv2.BFMatcher(cv2.NORM_HAMMING)
          pairs=bf.knnMatch(d1,d2,k=2)
          good=[a for a,b in pairs if a.distance < 0.72*b.distance]
          print('ORB_KEYPOINTS',len(k1),len(k2),'GOOD_MATCHES',len(good))
          if len(good)<12:
              raise SystemExit('Not enough good matches')
          src=np.float32([k1[m.queryIdx].pt for m in good]).reshape(-1,1,2)
          dst=np.float32([k2[m.trainIdx].pt for m in good]).reshape(-1,1,2)
          H,mask=cv2.findHomography(src,dst,cv2.RANSAC,4.0)
          if H is None:
              raise SystemExit('Homography failed')
          inliers=int(mask.sum()) if mask is not None else 0
          print('HOMOGRAPHY_INLIERS',inliers)
          print('HOMOGRAPHY',json.dumps(H.tolist()))

          # Project all previous interactive centers.
          points={
            '1':(.920833,.816667),'2':(.425521,.454630),'3':(.347917,.541667),
            '4':(.388021,.596296),'5':(.435938,.509259),'6_old':(.451042,.600000),
            '7':(.425521,.647222),'8':(.221875,.388889),'9':(.236979,.503704),
            '10':(.181771,.465741),'11':(.351042,.462037),'12':(.092708,.258333),
            '13':(.164063,.321296),'14':(.277604,.392593),'water':(.174,.394),
            'ingresso':(.3885,.765)
          }
          print('PROJECTED_POINTS_BEGIN')
          for key,(x,y) in points.items():
              p=np.array([[[x*wo,y*ho]]],dtype=np.float32)
              q=cv2.perspectiveTransform(p,H)[0,0]
              print(key,round(float(q[0]/wn),6),round(float(q[1]/hn),6),round(float(q[0]),1),round(float(q[1]),1))
          print('PROJECTED_POINTS_END')

          legend={
            '1':(.5935,.2413),'2':(.5935,.2896),'3':(.5935,.3364),'4':(.5935,.3831),
            '5':(.5935,.4299),'6':(.5935,.4796),'7':(.5935,.5249),'8':(.5935,.5716),
            '9':(.787,.2413),'10':(.787,.2896),'11':(.787,.3424),'12':(.787,.4284),
            '13':(.787,.4781),'14':(.787,.5264),'water':(.787,.5747)
          }
          print('PROJECTED_LEGEND_BEGIN')
          for key,(x,y) in legend.items():
              p=np.array([[[x*wo,y*ho]]],dtype=np.float32)
              q=cv2.perspectiveTransform(p,H)[0,0]
              print(key,round(float(q[0]/wn),6),round(float(q[1]/hn),6))
          print('PROJECTED_LEGEND_END')

          # Warp old into new coordinate frame and detect changed regions.
          warped=cv2.warpPerspective(old,H,(wn,hn))
          diff=cv2.absdiff(new,warped)
          gray=cv2.cvtColor(diff,cv2.COLOR_BGR2GRAY)
          gray=cv2.GaussianBlur(gray,(5,5),0)
          _,th=cv2.threshold(gray,38,255,cv2.THRESH_BINARY)
          th=cv2.morphologyEx(th,cv2.MORPH_OPEN,np.ones((3,3),np.uint8))
          th=cv2.dilate(th,np.ones((5,5),np.uint8),iterations=2)
          n,labels,stats,cent=cv2.connectedComponentsWithStats(th,8)
          comps=[]
          for i in range(1,n):
              x,y,w,h,area=stats[i]
              if area>=120 and w<=400 and h<=400:
                  comps.append((int(area),int(x),int(y),int(w),int(h),float(cent[i][0]),float(cent[i][1])))
          comps.sort(reverse=True)
          print('CHANGE_COMPONENTS_BEGIN')
          for c in comps[:40]:
              area,x,y,w,h,cx,cy=c
              print(area,x,y,w,h,round(cx,1),round(cy,1),round(cx/wn,6),round(cy/hn,6))
          print('CHANGE_COMPONENTS_END')
          PY
      - name: Locate moved point 6
        run: |
          python - <<'PY'
          import cv2, numpy as np
          old=cv2.imread('/tmp/old-map.webp',cv2.IMREAD_COLOR)
          new=cv2.imread('assets/maps/mappa-interattiva.webp',cv2.IMREAD_COLOR)
          # Old point 6 centre: 45.1042% / 60% on 1920x1080.
          cx,cy=866,648
          half=32
          templ=old[cy-half:cy+half, cx-half:cx+half]
          gray_new=cv2.cvtColor(new,cv2.COLOR_BGR2GRAY)
          gray_t=cv2.cvtColor(templ,cv2.COLOR_BGR2GRAY)
          candidates=[]
          for scale in np.linspace(.78,.94,33):
              t=cv2.resize(gray_t,None,fx=scale,fy=scale,interpolation=cv2.INTER_AREA)
              res=cv2.matchTemplate(gray_new,t,cv2.TM_CCOEFF_NORMED)
              # collect peaks with simple NMS per scale
              rr=res.copy()
              for _ in range(12):
                  _,v,_,loc=cv2.minMaxLoc(rr)
                  if v<0.35: break
                  h,w=t.shape[:2]
                  x,y=loc
                  candidates.append((float(v),float(scale),x+w/2,y+h/2,w,h))
                  x0=max(0,x-w); x1=min(rr.shape[1],x+2*w)
                  y0=max(0,y-h); y1=min(rr.shape[0],y+2*h)
                  rr[y0:y1,x0:x1]=-1
          # Global NMS.
          candidates.sort(reverse=True)
          keep=[]
          for cand in candidates:
              v,s,x,y,w,h=cand
              if all((x-k[2])**2+(y-k[3])**2>45**2 for k in keep):
                  keep.append(cand)
              if len(keep)>=30: break
          print('POINT6_TEMPLATE_MATCHES_BEGIN')
          for v,s,x,y,w,h in keep:
              print(round(v,5),round(s,4),round(x,1),round(y,1),round(x/1920,6),round(y/1080,6),w,h)
          print('POINT6_TEMPLATE_MATCHES_END')

          # Also locate the old legend 6 template to validate global registration.
          lcx,lcy=int(round(.5935*1920)),int(round(.4796*1080))
          half=24
          lt=old[lcy-half:lcy+half,lcx-half:lcx+half]
          glt=cv2.cvtColor(lt,cv2.COLOR_BGR2GRAY)
          lc=[]
          for scale in np.linspace(.78,.94,33):
              t=cv2.resize(glt,None,fx=scale,fy=scale,interpolation=cv2.INTER_AREA)
              res=cv2.matchTemplate(gray_new,t,cv2.TM_CCOEFF_NORMED)
              _,v,_,loc=cv2.minMaxLoc(res)
              h,w=t.shape[:2]
              lc.append((float(v),float(scale),loc[0]+w/2,loc[1]+h/2))
          lc.sort(reverse=True)
          print('LEGEND6_BEST',*[round(x,5) if isinstance(x,float) else x for x in lc[0]])
          PY
      - name: Emit preview
        run: |
          python - <<'PY'
          import cv2, base64
          im=cv2.imread('assets/maps/mappa-interattiva.webp',cv2.IMREAD_COLOR)
          preview=cv2.resize(im,(480,270),interpolation=cv2.INTER_AREA)
          ok,buf=cv2.imencode('.jpg',preview,[int(cv2.IMWRITE_JPEG_QUALITY),35])
          if not ok: raise SystemExit('encode failed')
          print('MAPJPEG_B64 '+base64.b64encode(buf.tobytes()).decode('ascii'))
          PY
      - name: Emit map crops
        run: |
          python - <<'PY'
          import cv2, base64
          im=cv2.imread('assets/maps/mappa-interattiva.webp')
          crops={
            'MAP_TOP': im[300:650,0:920],
            'MAP_BOTTOM': im[600:950,0:920],
          }
          for name,crop in crops.items():
              crop=cv2.resize(crop,(460,175),interpolation=cv2.INTER_AREA)
              ok,buf=cv2.imencode('.jpg',crop,[int(cv2.IMWRITE_JPEG_QUALITY),45])
              if not ok: raise SystemExit('encode failed')
              print(name+'_B64 '+base64.b64encode(buf.tobytes()).decode('ascii'))
          PY
      - name: OCR numeric markers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --quiet pytesseract
          python - <<'PY'
          import cv2, pytesseract
          from pytesseract import Output
          for name,path in [('OLD','/tmp/old-map.webp'),('NEW','assets/maps/mappa-interattiva.webp')]:
              im=cv2.imread(path)
              # upscale to improve OCR of the small numbered markers
              im=cv2.resize(im,None,fx=2,fy=2,interpolation=cv2.INTER_CUBIC)
              gray=cv2.cvtColor(im,cv2.COLOR_BGR2GRAY)
              data=pytesseract.image_to_data(
                  gray,
                  config='--psm 11 -c tessedit_char_whitelist=0123456789',
                  output_type=Output.DICT
              )
              print(name+'_OCR_BEGIN')
              for i,t in enumerate(data['text']):
                  t=t.strip()
                  if not t: continue
                  conf=float(data['conf'][i])
                  if conf < 15: continue
                  x=data['left'][i]/2; y=data['top'][i]/2
                  w=data['width'][i]/2; h=data['height'][i]/2
                  print(t,round(conf,1),round(x+w/2,1),round(y+h/2,1),round(x,1),round(y,1),round(w,1),round(h,1))
              print(name+'_OCR_END')
          PY
      - name: Refine point 6 marker
        run: |
          python - <<'PY'
          import cv2, numpy as np
          old=cv2.imread('/tmp/old-map.webp',cv2.IMREAD_COLOR)
          new=cv2.imread('assets/maps/mappa-interattiva.webp',cv2.IMREAD_COLOR)
          gn=cv2.cvtColor(new,cv2.COLOR_BGR2GRAY)
          cx,cy=866,648
          for half in (10,12,14,16,18,20,22):
              gt=cv2.cvtColor(old[cy-half:cy+half,cx-half:cx+half],cv2.COLOR_BGR2GRAY)
              allc=[]
              for scale in np.linspace(.80,.92,25):
                  t=cv2.resize(gt,None,fx=scale,fy=scale,interpolation=cv2.INTER_AREA)
                  res=cv2.matchTemplate(gn,t,cv2.TM_CCOEFF_NORMED)
                  rr=res.copy()
                  for _ in range(20):
                      _,v,_,loc=cv2.minMaxLoc(rr)
                      h,w=t.shape[:2]
                      x,y=loc
                      allc.append((float(v),float(scale),x+w/2,y+h/2))
                      x0=max(0,x-25); x1=min(rr.shape[1],x+w+25)
                      y0=max(0,y-25); y1=min(rr.shape[0],y+h+25)
                      rr[y0:y1,x0:x1]=-1
              allc.sort(reverse=True)
              keep=[]
              for z in allc:
                  if all((z[2]-k[2])**2+(z[3]-k[3])**2>28**2 for k in keep):
                      keep.append(z)
                  if len(keep)>=12: break
              print('HALF',half)
              for v,s,x,y in keep:
                  print(round(v,5),round(s,3),round(x,1),round(y,1),round(x/1920,6),round(y/1080,6))
          PY
