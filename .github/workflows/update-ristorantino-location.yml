name: Update Ristorantino location

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/update-ristorantino-location.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Update location
        shell: python
        run: |
          from pathlib import Path
          p = Path('vivi-pesaro.html')
          s = p.read_text(encoding='utf-8')
          old = 'data-location-id="ristorantino-trieste" data-lat="43.91724" data-lng="12.91302" href="https://maps.app.goo.gl/ztnkc7XbV14zxHnn8"'
          new = 'data-location-id="ristorantino-trieste" data-lat="43.920889" data-lng="12.9097882" href="https://maps.app.goo.gl/NqFt3R8zN4KV8hw97"'
          if old not in s:
              raise SystemExit('Riferimento Ristorantino non trovato')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vivi-pesaro.html
          git rm .github/workflows/update-ristorantino-location.yml
          git commit -m "Aggiorna posizione Ristorantino"
          git push origin HEAD:develop
