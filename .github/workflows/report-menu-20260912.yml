name: Admin report menu

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/report-menu-20260912.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Apply report menu changes
        run: python .github/scripts/report-menu-20260912.py

      - name: Validate JavaScript and diff
        run: |
          node --check boat-booking-admin.js
          node --check boat-booking-admin-list-ux.js
          node --check boat-booking-pdf-export.js
          node --check boat-booking-admin-reports.js
          node --check boat-booking-report-menu.js
          git diff --check

      - name: Commit and cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-prenotazioni-barche.html boat-booking-pdf-export.js boat-booking-admin-reports.js boat-booking-report-menu.js
          git rm .github/workflows/report-menu-20260912.yml .github/scripts/report-menu-20260912.py
          git commit -m "Riorganizza report prenotazioni admin"
          git push origin HEAD:develop
